databases:
  - name: recontent-db
    plan: free
    databaseName: recontent
    user: recontent

services:
  - type: web
    name: recontent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: recontent-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      - key: AI_MODE
        value: demo
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: FIREBASE_PROJECT_ID
        value: ""
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: INSTAGRAM_GRAPH_VERSION
        value: v25.0
      - key: PUBLIC_API_ORIGIN
        sync: false
